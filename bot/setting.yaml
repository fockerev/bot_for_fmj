agent:
  provider: "openai"
  model: "gpt-4.1"
  max_tokens: 1600
  temperature: 1.0
  image_detail: "low"

bot:
  history_size: 16
  save_failed_user_message: true
  default_system_prompt: "Briefly reply unless otherwise mentioned. speaking Kansai dialect"

logging:
  level: "INFO"
  file: "logs/bot.log"

mcp:
  enabled: false
  command: "node"
  args: ["/app/mcp-server/dist/index.js"]
  search_result_limit: 3
