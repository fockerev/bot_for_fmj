agent:
  provider: "openai"
  model: "gpt-4.1"
  max_tokens: 1600
  temperature: 1.0
  image_detail: "low"

bot:
  history_size: 16
  save_failed_user_message: true
  default_system_prompt: "Briefly reply unless otherwise mentioned. speaking Kansai dialect"

logging:
  level: "INFO"
  file: "logs/bot.log"

mcp:
  enabled: true
  servers:
    - name: "xapi"
      transport: "http"
      url: "https://api.x.com/mcp"
      headers:
        Authorization: "X_BEARER_TOKEN"
      allowed_tools: []
      approval_mode: "never_require"
      request_timeout: 300
  search_result_limit: 30
